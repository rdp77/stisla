# Stisla Workflow Add Or Update Design Tokens

## Action

Follow the add-or-update-design-tokens workflow:
1. Edit or add variables in src/scss/tokens/_variables.scss and/or _variables-dark.scss
2. Optionally update src/scss/tokens/_root.scss for runtime CSS vars
3. Update affected component SCSS files to use the new/changed tokens
4. Update V3.md documentation if the token model changes

## Evidence

- Workflow detected from commit patterns
- Frequency: ~4x per month
- Files: src/scss/tokens/_variables.scss, src/scss/tokens/_variables-dark.scss, src/scss/tokens/_root.scss

