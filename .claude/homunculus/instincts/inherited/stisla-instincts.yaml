# Stisla Workflow Add Or Update Demo Infrastructure

## Action

Follow the add-or-update-demo-infrastructure workflow:
1. Edit or add Nunjucks partials/macros in src/site/partials/_demo.njk
2. Edit or add site scripts in src/site/scripts/site.js
3. Edit or add site styles in src/site/styles/site.scss
4. Edit or add Nunjucks filters or build tools in tools/nunjucks-filters.mjs, tools/render-site.mjs, or tools/vite-plugin-nunjucks.mjs
5. Update V3.md if site conventions or demo patterns change

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: src/site/partials/_demo.njk, src/site/scripts/site.js, src/site/styles/site.scss

