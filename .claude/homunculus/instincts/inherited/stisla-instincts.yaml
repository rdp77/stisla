# Stisla Workflow Add Or Restyle Component With Demo

## Action

Follow the add-or-restyle-component-with-demo workflow:
1. Create or update the component SCSS file in src/scss/components/_component-name.scss
2. Import the component in src/scss/bundles/stisla-full.scss
3. Add or update theme tokens in src/scss/tokens/_variables.scss and/or _variables-dark.scss if needed
4. Create a demo page in src/site/pages/component-name.njk
5. Optionally update src/site/partials/_site-sidebar.njk to add the new page to the sidebar

## Evidence

- Workflow detected from commit patterns
- Frequency: ~10x per month
- Files: src/scss/components/_*.scss, src/scss/bundles/stisla-full.scss, src/scss/tokens/_variables.scss

